name: SecureBank CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bank_db
          MYSQL_USER: securebank
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/bank_db
      SPRING_DATASOURCE_USERNAME: securebank
      SPRING_DATASOURCE_PASSWORD: test_password

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and package
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t securebank:ci .