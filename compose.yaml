services:
  app:
    build: .
    image: securebank:local
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bank_db
      SPRING_DATASOURCE_USERNAME: securebank
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SERVER_ADDRESS: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: bank_db
      MYSQL_USER: securebank
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", 'mysqladmin ping -h localhost -u root --password="$${MYSQL_ROOT_PASSWORD}"' ]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

volumes:
  db_data:
  ollama_data: