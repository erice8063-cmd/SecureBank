<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Accounts | SecureBank</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        .page-shell{max-width:1200px;margin:auto;padding:32px 24px}.page-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.page-header h1{margin:0 0 6px}.page-header p{margin:0;color:#64748b}.page-actions{display:flex;gap:10px}.button-link{display:inline-flex;padding:10px 16px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;text-decoration:none;cursor:pointer;font:inherit}.button-link.secondary{background:#e2e8f0;color:#0f172a}.status{margin:18px 0;padding:12px 14px;border-radius:8px;background:#eff6ff;color:#1e3a8a}.status.error{background:#fef2f2;color:#991b1b}.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.account-card{padding:20px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.06)}.account-card h2{margin-top:0}.balance{font-size:1.7rem;font-weight:700}.details{display:grid;gap:8px}.details div{display:flex;justify-content:space-between;gap:16px}.details dt{color:#64748b}.details dd{margin:0;font-weight:600;text-align:right}@media(max-width:650px){.page-header{align-items:flex-start;flex-direction:column}}
    </style>
</head>
<body>
<main class="page-shell">
    <header class="page-header">
        <div><h1>Banking Accounts</h1><p id="pageSubtitle">Loading your account access...</p></div>
        <div class="page-actions">
            <a id="dashboardLink" class="button-link secondary" href="/home">Dashboard</a>
            <form action="/logout" method="post"><button class="button-link" type="submit">Log out</button></form>
        </div>
    </header>
    <div id="message" class="status" role="status">Loading accounts...</div>
    <section id="accounts" class="account-grid" aria-live="polite"></section>
</main>
<script>
    const CURRENT_USER_ENDPOINTS=["/api/users/me","/api/auth/me"];
    const ACCOUNT_API="/api/accounts";

    function normalizeRole(value){
        const role=String(value??"").toUpperCase().replace("ROLE_","");
        return ["CUSTOMER","TELLER","ADMIN"].includes(role)?role:"CUSTOMER";
    }
    function getRole(user){
        if(Array.isArray(user.roles)&&user.roles.length){
            const first=user.roles[0];
            return normalizeRole(typeof first==="string"?first:first.name??first.authority);
        }
        return normalizeRole(user.role??user.authority);
    }
    function dashboardFor(role){
        return {CUSTOMER:"/customer-dashboard",TELLER:"/teller-dashboard",ADMIN:"/admin-dashboard"}[role]??"/home";
    }
    async function fetchJson(url,options={}){
        const response=await fetch(url,{credentials:"same-origin",...options,headers:{Accept:"application/json",...(options.headers??{})}});
        if(response.status===401){window.location.assign("/login");throw new Error("Authentication required.");}
        if(response.status===403)throw new Error("You do not have permission to view these accounts.");
        if(!response.ok)throw new Error(`Request failed with status ${response.status}.`);
        return response.json();
    }
    async function loadCurrentUser(){
        for(const endpoint of CURRENT_USER_ENDPOINTS){
            try{return await fetchJson(endpoint);}
            catch(error){if(error.message==="Authentication required.")throw error;}
        }
        throw new Error("Unable to load the signed-in user.");
    }
    function money(value){
        return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(value??0));
    }
    function renderAccounts(accounts){
        const container=document.getElementById("accounts");
        container.replaceChildren();
        if(!Array.isArray(accounts)||!accounts.length){container.innerHTML="<p>No accounts were found.</p>";return;}
        accounts.forEach(account=>{
            const card=document.createElement("article");
            card.className="account-card";
            const title=document.createElement("h2");
            title.textContent=account.accountType??account.type??"Bank Account";
            const balance=document.createElement("p");
            balance.className="balance";
            balance.textContent=money(account.balance);
            const details=document.createElement("dl");
            details.className="details";
            [["Account number",account.accountNumber??account.id??"N/A"],["Status",account.status??"ACTIVE"],["Owner",account.customerName??account.ownerName??"Current customer"]].forEach(([label,value])=>{
                const row=document.createElement("div"),dt=document.createElement("dt"),dd=document.createElement("dd");
                dt.textContent=label;dd.textContent=value;row.append(dt,dd);details.appendChild(row);
            });
            card.append(title,balance,details);container.appendChild(card);
        });
    }
    async function initializePage(){
        const message=document.getElementById("message");
        try{
            const user=await loadCurrentUser(),role=getRole(user);
            document.getElementById("dashboardLink").href=dashboardFor(role);
            document.getElementById("pageSubtitle").textContent=role==="CUSTOMER"?"Review your SecureBank accounts and balances.":`Review bank accounts with ${role.toLowerCase()} access.`;
            renderAccounts(await fetchJson(ACCOUNT_API));
            message.hidden=true;
        }catch(error){
            message.hidden=false;message.classList.add("error");message.textContent=error.message;
            console.error("Account page failed:",error);
        }
    }
    initializePage();
</script>
</body>
</html>
