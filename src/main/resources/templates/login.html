<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="/css/style.css">

    <title>SecureBank - Login</title>
</head>

<body>

<main>
    <h1>SecureBank Login</h1>

    <p
            th:if="${param.error}"
            class="error"
    >
        Invalid email or password.
    </p>

    <p
            th:if="${param.logout}"
            class="success"
    >
        You have been signed out.
    </p>

    <p
            th:if="${param.registered}"
            class="success"
    >
        Registration successful. Please sign in.
    </p>

    <form
            method="post"
            action="/login"
    >
        <label for="email">
            Email
        </label>

        <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
        >

        <label for="password">
            Password
        </label>

        <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
        >

        <button type="submit">
            Login
        </button>
    </form>

    <p>
        Don't have an account?
        <a href="/register">Register</a>
    </p>
</main>

</body>
</html>
