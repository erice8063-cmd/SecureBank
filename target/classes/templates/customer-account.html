<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="/css/style.css">

    <title>SecureBank - Customer Account</title>
</head>

<body>

<h1>Customer Account</h1>

<div id="message"></div>
<div id="accounts"></div>

<script>
    const USER_ACCOUNT_API = "/api/user-accounts";

    async function loadCustomerAccounts() {
        const message = document.getElementById("message");
        const container = document.getElementById("accounts");
        try {
            message.innerText = "Loading customer accounts...";

            const response = await fetch(USER_ACCOUNT_API, {
                method: "GET",
                credentials: "same-origin",
                headers: {
                    "Accept": "application/json"
                }
            });

            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }

            if (response.status === 403) {
                message.innerText =
                    "Only tellers and administrators can review customer accounts.";
                return;
            }

            if (!response.ok) {
                throw new Error(
                    `Could not load customer accounts. Status: ${response.status}`
                );
            }

            const accounts = await response.json();

            message.innerText = "";
            container.innerHTML = "";

            if (!Array.isArray(accounts) || accounts.length === 0) {
                container.innerHTML = "<p>No customer accounts found.</p>";
                return;
            }

            accounts.forEach(account => {
                const div = document.createElement("div");

                div.innerHTML = `
                    <h3>Customer Account</h3>
                    <p>User ID: ${account.userId ?? "N/A"}</p>
                    <p>Account Number: ${account.accountNumber ?? "N/A"}</p>
                    <p>Balance: $${account.balance ?? "0.00"}</p>
                    <hr>
                `;

                container.appendChild(div);
            });

        } catch (error) {
            message.innerText = "Unable to load customer accounts.";
            console.error("Customer account request failed:", error);
        }
    }

    loadCustomerAccounts();
</script>

</body>
</html>
