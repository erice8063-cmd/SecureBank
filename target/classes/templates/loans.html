<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loans | SecureBank</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .page-shell{max-width:1200px;margin:auto;padding:32px 24px}.page-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.page-header h1{margin:0 0 6px}.page-header p{margin:0;color:#64748b}.page-actions{display:flex;gap:10px}.button-link{display:inline-flex;padding:10px 16px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;text-decoration:none;cursor:pointer;font:inherit}.button-link.secondary{background:#e2e8f0;color:#0f172a}.status{margin:18px 0;padding:12px 14px;border-radius:8px;background:#eff6ff;color:#1e3a8a}.status.error{background:#fef2f2;color:#991b1b}.layout{display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start}.loan-grid{display:grid;gap:16px}.loan-card,.application-panel{padding:20px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.06)}.loan-card h2,.application-panel h2{margin-top:0}.details{display:grid;gap:8px}.details div{display:flex;justify-content:space-between;gap:16px}.details dt{color:#64748b}.details dd{margin:0;font-weight:600;text-align:right}.field{display:grid;gap:6px;margin-bottom:14px}.field input,.field select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}@media(max-width:800px){.layout{grid-template-columns:1fr}}@media(max-width:650px){.page-header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main class="page-shell">
  <header class="page-header">
    <div><h1>Loans</h1><p id="pageSubtitle">Loading your loan access...</p></div>
    <div class="page-actions">
      <a id="dashboardLink" class="button-link secondary" href="/home">Dashboard</a>
      <form action="/logout" method="post"><button class="button-link" type="submit">Log out</button></form>
    </div>
  </header>
  <div id="message" class="status" role="status">Loading loans...</div>
  <div class="layout">
    <section><h2>Loan records</h2><div id="loans" class="loan-grid" aria-live="polite"></div></section>
    <section id="applicationPanel" class="application-panel">
      <h2>Apply for a loan</h2>
      <form id="loanForm">
        <div class="field"><label for="amount">Loan amount</label><input type="number" id="amount" step="0.01" min="0.01" required></div>
        <div class="field"><label for="loanType">Loan type</label><select id="loanType" required><option value="PERSONAL">Personal loan</option><option value="AUTO">Auto loan</option><option value="HOME">Home loan</option></select></div>
        <div class="field"><label for="term">Loan term</label><select id="term" required><option value="12">12 months</option><option value="24">24 months</option><option value="36">36 months</option><option value="48">48 months</option><option value="60">60 months</option></select></div>
        <button class="button-link" type="submit">Apply now</button>
      </form>
    </section>
  </div>
</main>
<script>
  const CURRENT_USER_ENDPOINTS=["/api/users/me","/api/auth/me"];
  const LOAN_API="/api/loans";

  function normalizeRole(value){
    const role=String(value??"").toUpperCase().replace("ROLE_","");
    return ["CUSTOMER","TELLER","ADMIN"].includes(role)?role:"CUSTOMER";
  }
  function getRole(user){
    if(Array.isArray(user.roles)&&user.roles.length){
      const first=user.roles[0];
      return normalizeRole(typeof first==="string"?first:first.name??first.authority);
    }
    return normalizeRole(user.role??user.authority);
  }
  function dashboardFor(role){
    return {CUSTOMER:"/customer-dashboard",TELLER:"/teller-dashboard",ADMIN:"/admin-dashboard"}[role]??"/home";
  }
  async function fetchJson(url,options={}){
    const response=await fetch(url,{credentials:"same-origin",...options,headers:{Accept:"application/json",...(options.headers??{})}});
    if(response.status===401){window.location.assign("/login");throw new Error("Authentication required.");}
    if(response.status===403)throw new Error("You do not have permission to perform this action.");
    if(!response.ok)throw new Error(`Request failed with status ${response.status}.`);
    if(response.status===204)return null;
    return response.json();
  }
  async function loadCurrentUser(){
    for(const endpoint of CURRENT_USER_ENDPOINTS){
      try{return await fetchJson(endpoint);}
      catch(error){if(error.message==="Authentication required.")throw error;}
    }
    throw new Error("Unable to load the signed-in user.");
  }
  function money(value){
    return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(value??0));
  }
  function renderLoans(loans){
    const container=document.getElementById("loans");
    container.replaceChildren();
    if(!Array.isArray(loans)||!loans.length){container.innerHTML="<p>No loans were found.</p>";return;}
    loans.forEach(loan=>{
      const card=document.createElement("article");
      card.className="loan-card";
      const title=document.createElement("h2");
      title.textContent=`${loan.loanType??loan.type??"Loan"} #${loan.id??"N/A"}`;
      const details=document.createElement("dl");
      details.className="details";
      [["Amount",money(loan.amount??loan.originalAmount)],["Remaining",money(loan.remainingBalance??loan.balance??loan.amount)],["Term",`${loan.term??"N/A"} months`],["Status",loan.status??"PENDING"],["Customer",loan.customerName??loan.borrowerName??"Current customer"]].forEach(([label,value])=>{
        const row=document.createElement("div"),dt=document.createElement("dt"),dd=document.createElement("dd");
        dt.textContent=label;dd.textContent=value;row.append(dt,dd);details.appendChild(row);
      });
      card.append(title,details);container.appendChild(card);
    });
  }
  async function loadLoans(){renderLoans(await fetchJson(LOAN_API));}
  async function initializePage(){
    const message=document.getElementById("message");
    try{
      const user=await loadCurrentUser(),role=getRole(user);
      document.getElementById("dashboardLink").href=dashboardFor(role);
      document.getElementById("pageSubtitle").textContent=role==="CUSTOMER"?"Review your loans or submit a new application.":`Review loan records with ${role.toLowerCase()} access.`;
      document.getElementById("applicationPanel").hidden=role!=="CUSTOMER";
      await loadLoans();message.hidden=true;
    }catch(error){
      message.hidden=false;message.classList.add("error");message.textContent=error.message;
      console.error("Loan page failed:",error);
    }
  }
  document.getElementById("loanForm").addEventListener("submit",async event=>{
    event.preventDefault();
    const message=document.getElementById("message"),button=event.currentTarget.querySelector("button");
    button.disabled=true;
    try{
      await fetchJson(LOAN_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
          amount:Number(document.getElementById("amount").value),
          loanType:document.getElementById("loanType").value,
          term:Number(document.getElementById("term").value)
        })});
      event.currentTarget.reset();await loadLoans();
      message.hidden=false;message.classList.remove("error");message.textContent="Loan application submitted successfully.";
    }catch(error){
      message.hidden=false;message.classList.add("error");message.textContent=error.message;
      console.error("Loan application failed:",error);
    }finally{button.disabled=false;}
  });
  initializePage();
</script>
</body>
</html>
