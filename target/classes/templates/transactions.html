
<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>SecureBank - Transactions</title>

</head>

<body>

<h1>Deposits & Withdrawals</h1>


<h2>Make a Transaction</h2>

<form id="transactionForm">

    <label for="accountId">
        Account ID:
    </label>

    <input
            type="number"
            id="accountId"
            required
    >

    <br><br>


    <label for="transactionType">
        Transaction Type:
    </label>

    <select id="transactionType">

        <option value="DEPOSIT">
            Deposit
        </option>

        <option value="WITHDRAWAL">
            Withdrawal
        </option>

    </select>

    <br><br>


    <label for="amount">
        Amount:
    </label>

    <input
            type="number"
            id="amount"
            min="0.01"
            step="0.01"
            required
    >

    <br><br>


    <button type="submit">
        Submit
    </button>

</form>


<p id="message"></p>


<h2>Transactions</h2>

<div id="transactions"></div>


<script>

    const TRANSACTION_API = "/api/transactions";


    async function loadTransactions() {

        try {

            const response =
                await fetch(
                    TRANSACTION_API,
                    {
                        credentials: "same-origin",
                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }

            if (response.status === 403) {
                throw new Error("You do not have permission to view transactions");
            }

            if (!response.ok) {

                throw new Error(
                    "Unable to load transactions"
                );

            }


            const transactions =
                await response.json();


            const container =
                document.getElementById(
                    "transactions"
                );


            container.innerHTML = "";


            transactions.forEach(
                transaction => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.innerHTML = `
                        <p>
                            Transaction ID:
                            ${transaction.id}
                        </p>

                        <p>
                            Amount:
                            ${transaction.amount ?? ""}
                        </p>

                        <p>
                            Type:
                            ${transaction.type ?? ""}
                        </p>

                        <hr>
                    `;


                    container.appendChild(div);

                }
            );


        } catch (error) {

            console.error(error);

            document.getElementById(
                "message"
            ).innerText =
                error.message;

        }

    }


    document
        .getElementById("transactionForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const transaction = {

                    accountId:
                        Number(
                            document.getElementById(
                                "accountId"
                            ).value
                        ),

                    type:
                    document.getElementById(
                        "transactionType"
                    ).value,

                    amount:
                        Number(
                            document.getElementById(
                                "amount"
                            ).value
                        )

                };


                try {

                    const response =
                        await fetch(
                            TRANSACTION_API,
                            {
                                method: "POST",
                                credentials: "same-origin",

                                headers: {

                                    "Content-Type":
                                        "application/json",
                                    "Accept":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        transaction
                                    )
                            }
                        );


                    if (response.status === 401) {
                        window.location.href = "/login";
                        return;
                    }

                    if (response.status === 403) {
                        throw new Error("You do not have permission to create transactions");
                    }

                    if (!response.ok) {

                        throw new Error(
                            "Transaction failed"
                        );

                    }


                    document.getElementById(
                        "message"
                    ).innerText =
                        "Transaction completed.";


                    document
                        .getElementById(
                            "transactionForm"
                        )
                        .reset();


                    loadTransactions();


                } catch (error) {

                    document.getElementById(
                        "message"
                    ).innerText =
                        error.message;

                    console.error(error);

                }

            }
        );


    loadTransactions();

</script>

</body>
</html>
